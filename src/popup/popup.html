<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>后台新标签页</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1 class="popup-title">后台新标签页</h1>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle" aria-describedby="status" disabled>
      <span class="switch-label">启用扩展</span>
    </label>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button type="button" id="open-options" class="secondary-button">设置</button>
  </main>
  <script src="../shared/rules.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
