<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>后台新标签页 · 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>后台新标签页</h1>
      <p class="subtitle">
        普通左键点击链接时，按下面的规则决定标签页的打开方式。网址规则优先于域名规则；同类规则按列表顺序匹配，第一条命中的规则生效；都没命中时使用全局默认行为。总开关在工具栏弹窗中。
      </p>
    </header>

    <p id="page-status" class="status" role="status" aria-live="polite"></p>

    <section class="card">
      <h2>全局默认行为</h2>
      <div class="field">
        <label for="default-action">没有规则命中时</label>
        <select id="default-action" data-action-select></select>
      </div>
    </section>

    <section class="card">
      <h2>域名规则</h2>
      <p class="hint">默认只匹配完全相同的域名；勾选“包含子域名”后，该域名的所有子域名也一起匹配。</p>
      <form id="domain-form" class="rule-form" novalidate>
        <div class="field">
          <label for="domain-input">域名</label>
          <input id="domain-input" type="text" placeholder="example.com" autocomplete="off"
                 spellcheck="false" aria-describedby="domain-error">
        </div>
        <div class="field field-checkbox">
          <input id="domain-subdomains" type="checkbox">
          <label for="domain-subdomains">包含子域名</label>
        </div>
        <div class="field">
          <label for="domain-action">动作</label>
          <select id="domain-action" data-action-select></select>
        </div>
        <div class="form-actions">
          <button type="submit" id="domain-submit">添加规则</button>
          <button type="button" id="domain-cancel" class="secondary-button" hidden>取消编辑</button>
        </div>
        <p id="domain-error" class="field-error" role="alert" hidden></p>
      </form>
      <ol id="domain-list" class="rule-list" aria-label="域名规则列表"></ol>
    </section>

    <section class="card">
      <h2>网址规则</h2>
      <p class="hint">填写 http:// 或 https:// 开头的模式，<code>*</code> 匹配零个或多个字符，例如 <code>https://example.com/private/*</code>。</p>
      <form id="url-form" class="rule-form" novalidate>
        <div class="field">
          <label for="url-pattern">网址模式</label>
          <input id="url-pattern" type="text" placeholder="https://example.com/path/*" autocomplete="off"
                 spellcheck="false" aria-describedby="url-error">
        </div>
        <div class="field">
          <label for="url-action">动作</label>
          <select id="url-action" data-action-select></select>
        </div>
        <div class="form-actions">
          <button type="submit" id="url-submit">添加规则</button>
          <button type="button" id="url-cancel" class="secondary-button" hidden>取消编辑</button>
        </div>
        <p id="url-error" class="field-error" role="alert" hidden></p>
      </form>
      <ol id="url-list" class="rule-list" aria-label="网址规则列表"></ol>
    </section>
  </main>
  <script src="../shared/rules.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
